# Solo dual-mode bridge — build ALL platforms and publish on a version tag.
# Push a tag `vX.Y.Z`: every platform is compiled and its package uploaded to the
# project generic package registry (public for a public project).
# (moved from GitHub Actions when the GitHub account was suspended, 2026-10-23.)

variables:
  CARGO_TERM_COLOR: always

stages: [build]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

.verify_and_package: &verify_and_package
  - BIN="bridge-src/target/$TARGET/release/$BINARY"
  - test -f "$BIN"
  - '"$BIN" --version'
  - grep -a -q ZKAS_KASPA_NODE "$BIN"
  - mkdir -p dist && cp "$BIN" dist/ && cp bridge.yaml.template README.md install.sh install.ps1 run.ps1 dist/
  - ZIP="solo-dual-mode-$ARTIFACT.zip"
  - (cd dist && zip -r "../$ZIP" .)
  - sha256sum "$ZIP"
  - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$ZIP" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/solo-dual-mode/${CI_COMMIT_TAG}/${ZIP}"'

.unix:
  stage: build
  variables: { BINARY: stratum-bridge }
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq curl git build-essential pkg-config libssl-dev protobuf-compiler zip > /dev/null
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --target "$TARGET"
    - source "$HOME/.cargo/env"
  script:
    - cargo build --locked --release --manifest-path bridge-src/Cargo.toml --bin stratum-bridge --target "$TARGET"
    - *verify_and_package
  artifacts: { paths: ["solo-dual-mode-*.zip"], expire_in: 90 days }

build:linux-x64:
  extends: .unix
  image: ubuntu:22.04
  variables: { TARGET: x86_64-unknown-linux-gnu, ARTIFACT: linux-x64 }

build:linux-arm64:
  extends: .unix
  image: ubuntu:22.04
  tags: [saas-linux-medium-arm64]
  variables: { TARGET: aarch64-unknown-linux-gnu, ARTIFACT: linux-arm64 }

.macos:
  extends: .unix
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  allow_failure: true
  before_script:
    - brew install protobuf || true
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --target "$TARGET"
    - source "$HOME/.cargo/env"

build:macos-x64:
  extends: .macos
  variables: { TARGET: x86_64-apple-darwin, ARTIFACT: macos-x64 }

build:macos-arm64:
  extends: .macos
  variables: { TARGET: aarch64-apple-darwin, ARTIFACT: macos-arm64 }

build:windows-x64:
  stage: build
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  variables: { TARGET: x86_64-pc-windows-msvc }
  before_script:
    - '$ProgressPreference = ''SilentlyContinue'''
    - 'Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v27.3/protoc-27.3-win64.zip" -OutFile protoc.zip'
    - 'Expand-Archive protoc.zip -DestinationPath C:\protoc'
    - '$env:PATH = "C:\protoc\bin;$env:PATH"'
    - 'Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe'
    - '.\rustup-init.exe -y --profile minimal --target $env:TARGET'
    - '$env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"'
  script:
    - 'cargo build --locked --release --manifest-path bridge-src/Cargo.toml --bin stratum-bridge --target $env:TARGET'
    - '& "bridge-src\target\$env:TARGET\release\stratum-bridge.exe" --version'
    - 'New-Item -ItemType Directory -Force dist | Out-Null'
    - 'Copy-Item "bridge-src\target\$env:TARGET\release\stratum-bridge.exe", bridge.yaml.template, README.md, install.sh, install.ps1, run.ps1 dist\'
    - 'Compress-Archive -Path dist\* -DestinationPath solo-dual-mode-windows-x64.zip -Force'
    - 'curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file solo-dual-mode-windows-x64.zip "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/solo-dual-mode/$env:CI_COMMIT_TAG/solo-dual-mode-windows-x64.zip"'
  artifacts: { paths: ["solo-dual-mode-*.zip"], expire_in: 90 days }
